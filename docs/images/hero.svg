<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc">
  <title id="title">Security Team</title>
  <desc id="desc">One skill selects security specialists from eleven repositories, coordinates review, verifies findings, and reports evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A1019"/><stop offset="1" stop-color="#172739"/></linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EAAA77"/><stop offset="1" stop-color="#CB784E"/></linearGradient>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#607A93" opacity=".27"/></pattern>
  </defs>
  <rect width="1280" height="450" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="450" rx="20" fill="url(#grid)"/>
  <path d="M0 90H1280M0 360H1280" stroke="#29384B"/>
  <rect x="65" y="53" width="8" height="28" rx="2" fill="url(#copper)"/>
  <text x="90" y="74" fill="#F0B58A" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="18" letter-spacing="4">PROJECT-AWARE AUDITING</text>
  <text x="65" y="187" fill="#F5F5F2" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="78" letter-spacing="-3">SECURITY</text>
  <text x="65" y="267" fill="url(#copper)" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="78" letter-spacing="-3">TEAM</text>
  <text x="68" y="313" fill="#C5D2DD" font-family="Segoe UI,Arial,sans-serif" font-size="21">One skill. Eleven sources. The right review team.</text>
  <rect x="68" y="343" width="310" height="2" fill="url(#copper)"/>
  <text x="68" y="386" fill="#90A9BE" font-family="Consolas,monospace" font-size="14" letter-spacing="1">ASSESS  /  SELECT  /  VERIFY</text>
  <rect x="696" y="73" width="515" height="304" rx="17" fill="#0D1825" stroke="#405167" stroke-width="1.5"/>
  <text x="738" y="108" fill="#92B0C4" font-family="Consolas,monospace" font-size="14" letter-spacing="1.5">COORDINATION / AUDIT PLAN</text>
  <circle cx="1165" cy="104" r="4" fill="#75B7BB"/>
  <path d="M740 120H1167" stroke="#2C3C50"/>
  <rect x="740" y="158" width="145" height="84" rx="9" fill="#182A3D" stroke="#567086"/>
  <text x="757" y="182" fill="#A7C9D7" font-family="Consolas,monospace" font-size="12">01 / PROJECT</text>
  <text x="757" y="215" fill="#F3F5F6" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Assess</text>
  <path d="M888 201H925M916 194L925 201L916 208" stroke="#DEA06F" stroke-width="3" fill="none"/>
  <rect x="930" y="158" width="237" height="84" rx="9" fill="#322A25" stroke="#A57D5B"/>
  <text x="947" y="182" fill="#EABD95" font-family="Consolas,monospace" font-size="12">02 / SELECT</text>
  <text x="947" y="215" fill="#F3F5F6" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">11 candidates</text>
  <path d="M811 242V276H951V296M951 242V276M1094 242V276H951" fill="none" stroke="#648BA2" stroke-width="2"/>
  <rect x="740" y="294" width="123" height="51" rx="8" fill="#19333E" stroke="#4E8A93"/>
  <rect x="884" y="294" width="124" height="51" rx="8" fill="#19333E" stroke="#4E8A93"/>
  <rect x="1029" y="294" width="138" height="51" rx="8" fill="#382C26" stroke="#B6825D"/>
  <text x="758" y="326" fill="#D6ECEE" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">AUDIT</text>
  <text x="899" y="326" fill="#D6ECEE" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">VERIFY</text>
  <text x="1045" y="326" fill="#F4DDC9" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">REPORT</text>
</svg>
